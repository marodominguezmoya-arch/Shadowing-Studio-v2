name = "shadowing-studio"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Le Worker ne répond que sous maromoya.com/shadowingstudio — le reste du site n'est pas touché.
routes = [
  { pattern = "maromoya.com/shadowingstudio*", zone_name = "maromoya.com" },
]

[vars]
# Adresse GitHub Pages du dépôt de l'app (sans « / » final).
ORIGIN_BASE = "https://marodominguezmoya-arch.github.io/Shadowing-Studio-v2"
# Identifiant de la base Notion « Shadowing Studio — CRM » (affiché par scripts/notion-setup.mjs).
NOTION_DATABASE_ID = "7690ebbdcdf74679bf04166448fe5975"
ALLOWED_ORIGINS = "https://maromoya.com"

# Anti-abus : 5 envois par minute et par adresse IP.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secret à définir une fois (jamais dans ce fichier) :
#   npx wrangler secret put NOTION_TOKEN
